[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-refactor"
version = "0.4.0"
description = "Refactored orbital state estimation core and pipelines"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
]

[project.optional-dependencies]
gnn = ["torch"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "adapters*",
  "brain_inspired*",
  "cooperative*",
  "examples*",
  "experiments*",
  "exporters*",
  "interfaces*",
  "orbital_core*",
  "pipelines*",
  "scenarios*",
  "visualization*",
]
exclude = ["tests*", "legacy*", "results*", "configs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
