[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-refactor"
version = "0.3.0"
description = "Refactored orbital state estimation core and pipelines"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
